name: Clean Legacy X Firm Performance Waste

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-performance.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HESTIA_PORT }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      - name: Apply safe WordPress cleanup
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" \
            "set -e; cd '${{ secrets.DEPLOY_PATH }}'; \
             echo '=== DEACTIVATE NONESSENTIAL ACTIVE PLUGINS ==='; \
             wp plugin deactivate duplicate-page massive-cryptocurrency-widgets meks-simple-flickr-widget backup instagram-feed optinmonster wpforms || true; \
             echo '=== REMOVE CLEARLY UNUSED INACTIVE PLUGIN FILES ==='; \
             rm -rf wp-content/plugins/akismet wp-content/plugins/case-theme-import wp-content/plugins/duplicate-page wp-content/plugins/massive-cryptocurrency-widgets wp-content/plugins/meks-simple-flickr-widget wp-content/plugins/wpforms-lite; \
             rm -f wp-content/plugins/hello.php; \
             echo '=== DISABLE BROKEN OLD ENDURANCE HOST CACHE ==='; \
             if [ -f wp-content/mu-plugins/endurance-page-cache.php ]; then mv wp-content/mu-plugins/endurance-page-cache.php wp-content/mu-plugins/endurance-page-cache.php.disabled; fi; \
             echo '=== CLEAR EXPIRED TRANSIENTS ==='; \
             wp transient delete --expired || true; \
             echo '=== RESULT ==='; \
             wp plugin list --fields=name,status,version --format=table"
