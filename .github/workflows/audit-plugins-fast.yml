name: Fast Plugin Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-plugins-fast.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HESTIA_PORT }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      - name: List plugins and sizes
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}'; \
             echo '=== PLUGINS ==='; timeout 20 wp plugin list --fields=name,status,version,update --format=table || true; \
             echo '=== THEMES ==='; timeout 20 wp theme list --fields=name,status,version --format=table || true; \
             echo '=== SIZES ==='; du -sh wp-content/plugins/* 2>/dev/null | sort -h || true"
