name: Audit Legacy X Firm Performance

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-performance.yml"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HESTIA_PORT }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect background plugin load
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}'; \
             echo '=== BACKUP PLUGIN HEADER ==='; grep -Rim1 '^Plugin Name:' wp-content/plugins/backup 2>/dev/null || true; \
             echo '=== UPDRAFT HEADER ==='; grep -Rim1 '^Plugin Name:' wp-content/plugins/updraftplus 2>/dev/null || true; \
             echo '=== SECURITY HEADERS ==='; grep -Rim1 '^Plugin Name:' wp-content/plugins/imunify-security 2>/dev/null || true; grep -Rim1 '^Plugin Name:' wp-content/plugins/wordfence 2>/dev/null || true; \
             echo '=== CRON HOOKS ==='; wp cron event list --fields=hook,next_run_relative,recurrence --format=table 2>/dev/null | grep -Ei 'updraft|backup|wordfence|imunify|optin|instagram|wpforms|woocommerce|yith' || true"
