name: Deploy Legacy X Firm to Hestia

on:
  push:
    branches:
      - main
    paths:
      - "wp-content/themes/legacy-x-firm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: legacy-x-firm-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HESTIA_PORT }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Hestia connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" \
            "test -d '${{ secrets.DEPLOY_PATH }}/wp-content/themes'"

      - name: Deploy Legacy X Firm theme
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.HESTIA_PORT }} -o BatchMode=yes" \
            wp-content/themes/legacy-x-firm/ \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/themes/legacy-x-firm/"

      - name: Activate and verify production theme
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"
          test -f wp-content/themes/legacy-x-firm/style.css
          test -f wp-content/themes/legacy-x-firm/front-page.php
          test -f wp-content/themes/legacy-x-firm/client-portal.php
          grep -q "Theme Name: Legacy X Firm" wp-content/themes/legacy-x-firm/style.css
          grep -q "Build wealth" wp-content/themes/legacy-x-firm/front-page.php
          wp theme activate legacy-x-firm
          wp cache flush >/dev/null 2>&1 || true
          wp theme list --status=active --field=name | grep -qx "legacy-x-firm"
          echo "Legacy X Firm standalone theme activated and verified."
          REMOTE

      - name: Deployment complete
        run: echo "Legacy X Firm deployed successfully to Hestia."
