name: Audit All Published Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-all-pages.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HESTIA_PORT }}" -H "${{ secrets.HESTIA_HOST }}" >> ~/.ssh/known_hosts

      - name: Scan all published page assets
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.HESTIA_PORT }}" -o BatchMode=yes \
            "${{ secrets.HESTIA_USER }}@${{ secrets.HESTIA_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}'; \
             HOMEURL=\$(wp option get home); \
             echo '=== ROOT ==='; curl -Lks --max-time 15 \"\$HOMEURL/\" | grep -Eo '/wp-content/plugins/[A-Za-z0-9._-]+' | sed 's#^/wp-content/plugins/##' | sort -u || true; \
             for slug in \$(wp post list --post_type=page --post_status=publish --field=post_name); do \
               echo \"=== PAGE: \$slug ===\"; \
               curl -Lks --max-time 15 \"\$HOMEURL/\$slug/\" | grep -Eo '/wp-content/plugins/[A-Za-z0-9._-]+' | sed 's#^/wp-content/plugins/##' | sort -u || true; \
             done"
